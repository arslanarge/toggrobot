name: APK derle

on:
  push:
    paths-ignore:
      - "tools/**"
      - ".github/workflows/explore.yml"
      - ".github/workflows/screens.yml"
      - "tools/screens.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Imza anahtarini hazirla
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 ve SIGNING_PASSWORD secret'lari eklenmemis (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Derle
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: APK'yi yeniden adlandir
        run: cp app/build/outputs/apk/release/app-release.apk ToggRobot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ToggRobot-apk
          path: ToggRobot.apk

      - name: Telefondan indirilebilir surum (Release) olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Togg Robot APK (build ${{ github.run_number }})
          make_latest: true
          files: ToggRobot.apk
          body: |
            Telefondan bu sayfayi acip **ToggRobot.apk** dosyasina dokunarak indir ve kur.
            Branch: ${{ github.ref_name }} — commit ${{ github.sha }}
